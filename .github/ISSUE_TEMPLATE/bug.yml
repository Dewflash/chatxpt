name: Bug report
description: Report a reproducible ChatXPT failure
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Owning role
      options:
        - Role 1 - Integrations and shared platform
        - Role 2 - AI intelligence and data extraction
        - Role 3 - Quest engine
        - Role 4 - Streamer Studio UI/UX
        - Role 5 - Viewer Quest Board UI/UX
        - Unknown - needs Role 1 triage
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include inputs, route, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: reality_mode
    attributes:
      label: Affected mode
      options:
        - Live provider or platform path
        - Mock or deterministic fallback
        - Simulated gameplay path
        - Multiple modes
        - Unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include browser/device, branch or commit, screenshots/logs without secrets, and commands actually run.
    validations:
      required: true
