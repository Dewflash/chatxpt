name: Bug report
description: Report a reproducible ChatXPT failure
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include inputs, route, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Generation mode
      options: [Mock, OpenAI, Both, Unknown]
    validations:
      required: true
