name: Cross-role proposal
description: Coordinate a substantial cross-role feature, contract, overlap, or unresolved decision without blocking implementation.
title: "[Cross-role] "
labels:
  - cross-role
body:
  - type: markdown
    attributes:
      value: |
        This issue is a coordination record, not a permission gate. Implementation may proceed after overlap is checked and the relevant leads plus `@Dewflash` are notified. Role 1 helps deconflict before merge.
  - type: dropdown
    id: originating_role
    attributes:
      label: Originating role
      options:
        - Role 1 - Integrations and shared platform
        - Role 2 - AI intelligence and data extraction
        - Role 3 - Quest engine
        - Role 4 - Streamer Studio UI/UX
        - Role 5 - Viewer Quest Board UI/UX
    validations:
      required: true
  - type: dropdown
    id: target_role
    attributes:
      label: Target role
      options:
        - Role 1 - Integrations and shared platform
        - Role 2 - AI intelligence and data extraction
        - Role 3 - Quest engine
        - Role 4 - Streamer Studio UI/UX
        - Role 5 - Viewer Quest Board UI/UX
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: State the evidenced need without prescribing another role's implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal from the originating role
      description: Explain the desired outcome, relevant evidence, why it crosses responsibilities, and any implementation already in progress.
    validations:
      required: true
  - type: textarea
    id: affected_contracts
    attributes:
      label: Affected contracts, files, or decisions
      description: Link relevant types, issues, decisions, screenshots, or evaluation evidence.
    validations:
      required: true
  - type: textarea
    id: target_comparison
    attributes:
      label: Target owner's comparison
      description: Target owner completes this with its existing approach, trade-offs, recommendation, and dependencies.
      placeholder: "Target owner: edit after comparison."
    validations:
      required: false
  - type: dropdown
    id: proposed_status
    attributes:
      label: Current status
      options:
        - Awaiting target comparison
        - Awaiting project-owner awareness
        - Accepted
        - Rejected
        - Deferred
    validations:
      required: true
  - type: checkboxes
    id: authority
    attributes:
      label: Authority checks
      options:
        - label: I have mentioned the target owner and `@Dewflash` in the issue text or comments.
          required: true
        - label: I checked for overlapping branches or pull requests and recorded any known deconfliction need.
          required: true
