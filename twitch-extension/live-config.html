<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatXPT Live Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="assets/extension.css">
  </head>
  <body data-surface="live-config">
    <main class="shell" aria-label="ChatXPT live configuration surface">
      <p class="kicker">ChatXPT Live Config</p>
      <h1>Live control surface reserved</h1>
      <p>
        This stream-time control surface is present for Twitch path validation. Approve, skip,
        cancel, and emergency controls are connected through ChatXPT runtime work, not this shell.
      </p>
      <section class="status" aria-label="Current status">
        <span>Setup shell</span>
        <strong>Not connected</strong>
      </section>
    </main>
  </body>
</html>
