<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatXPT Live Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="assets/extension.css">
    <script defer src="assets/environment.js"></script>
    <script defer src="assets/broadcaster.js"></script>
  </head>
  <body data-surface="live-config">
    <main class="shell control-shell" aria-label="ChatXPT live configuration surface">
      <header class="voter-header">
        <div><p class="kicker">Twitch Live Config</p><h1>Live control</h1></div>
        <span id="connection-state" class="pill">Connecting</span>
      </header>
      <p id="control-message" class="status-line" aria-live="polite">Waiting for Twitch broadcaster authorization.</p>
      <div id="broadcaster-content" class="control-content"></div>
      <a id="studio-link" class="studio-link" href="#" target="_blank" rel="noreferrer">Open full Studio</a>
    </main>
  </body>
</html>
