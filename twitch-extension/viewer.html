<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatXPT Viewer</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="assets/extension.css">
    <script defer src="assets/environment.js"></script>
    <script defer src="assets/viewer.js"></script>
  </head>
  <body data-surface="viewer">
    <main class="shell voter-shell broadcast-card" aria-label="ChatXPT viewer voting surface">
      <header class="voter-header">
        <div>
          <p id="surface-label" class="kicker">Audience vote</p>
          <h1 id="surface-title">Vote now</h1>
        </div>
        <div class="voter-meta">
          <p id="countdown" class="countdown" hidden></p>
          <span id="connection-state" class="pill">Connecting</span>
        </div>
      </header>
      <section class="voter-scroll">
        <div class="state-explainer">
          <span>What this means</span>
          <small id="state-explanation">Keep this panel open for the next audience sidequest.</small>
        </div>
        <section id="quest-list" class="quest-list" aria-label="Sidequest choices">
          <div class="empty-state">
            <strong>No vote is open.</strong>
            <span>Stay here for the next audience sidequest.</span>
          </div>
        </section>
        <section id="viewer-engagement" class="viewer-engagement" aria-label="Viewer engagement" hidden>
          <div><span>Community hype</span><strong id="community-hype">0</strong></div>
          <div><span>Your session points</span><strong id="session-points">0</strong></div>
          <button id="send-hype" type="button" disabled>Send hype</button>
        </section>
      </section>
      <footer class="voter-actions">
        <button id="submit-vote" class="submit-vote" disabled hidden>Vote</button>
        <p id="vote-status" class="status-line" aria-live="polite">Waiting for Twitch authorization.</p>
      </footer>
    </main>
  </body>
</html>
